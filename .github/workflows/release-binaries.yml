name: "Build & Release Bangen"

on:
  workflow_dispatch:
  push:
    paths:
      - "pyproject.toml"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: extract
        run: |
          VERSION=$(python3 - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.extract.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git tag "${{ steps.extract.outputs.tag }}"
          git push origin "${{ steps.extract.outputs.tag }}"

  build:
    needs: tag
    if: needs.tag.outputs.exists == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bin: bangen
          - os: windows-latest
            platform: windows
            bin: bangen.exe
          - os: macos-latest
            platform: macos
            bin: bangen

    steps:
      - uses: actions/checkout@v4

      # Windows & macOS native Python setup (3.13, to match the only PyInstaller-usable
      # interpreter available in the Linux manylinux2014-shared image below)
      - if: matrix.platform != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Cache pip's download cache + yum's package cache for the Linux container build,
      # since those aren't covered by setup-python (which only runs for windows/macos above).
      - if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            .cache/pip
            .cache/yum
          key: linux-build-cache-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            linux-build-cache-

      # Core Build step handling logic per platform
      - name: Build Executable
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          printf 'from bangen.app import main\nif __name__=="__main__": main()\n' > _entry.py

          # 2. Extract dependencies dynamically using standardized PEP 508 parsing
          GENERATE_FLAGS_SCRIPT=$(cat <<'PYTHON_SCRIPT'
          import tomllib
          from packaging.requirements import Requirement

          pkg_to_module = {"Pillow": "PIL"}
          modules = ["bangen"]

          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f).get("project", {}).get("dependencies", [])

          for dep in deps:
              name = Requirement(dep).name
              modules.append(pkg_to_module.get(name, name))

          print(" ".join(f"--collect-all {m}" for m in sorted(set(modules))))
          PYTHON_SCRIPT
          )

          # 3. Compile executable
          if [[ "$PLATFORM" == "linux" ]]; then
            # This is a fork of the standard manylinux image, customized by yt-dlp specifically
            # for building PyInstaller executables (see github.com/yt-dlp/manylinux-shared).
            # The normal /opt/python/<tag> interpreters in this image (e.g. cp311-cp311) are
            # static builds meant only for compiling wheels -- PyInstaller can't use them
            # ("Python was built without a shared library"). The image only ships a
            # PyInstaller-usable *shared* build for 3.13 and 3.14, at /opt/shared-cpython-3.13
            # and /opt/shared-cpython-3.14. We use 3.13 here to match Windows/macOS above.
            mkdir -p .cache/pip .cache/yum
            docker run --rm \
              -e HOME=/root \
              -e HOST_UID=$(id -u) \
              -e HOST_GID=$(id -g) \
              -v "${{ github.workspace }}:/workspace" \
              -v "${{ github.workspace }}/.cache/pip:/root/.cache/pip" \
              -v "${{ github.workspace }}/.cache/yum:/var/cache/yum" \
              -w /workspace \
              ghcr.io/yt-dlp/manylinux2014_x86_64-shared \
              bash -c "
                set -euo pipefail
                # Pillow only ships manylinux_2_27/2_28 wheels these days, which this
                # manylinux2014 (CentOS7/glibc2.17) image can't use, so pip falls back to
                # building it from source. That needs libjpeg's headers, which this image
                # doesn't ship by default. Install them via yum (root required, hence no
                # -u/-e HOME=/tmp on this docker run). Cached across runs via /var/cache/yum.
                yum install -y libjpeg-turbo-devel zlib-devel >/dev/null
                PY=/opt/shared-cpython-3.13/bin/python3.13
                \$PY -m pip install -U pip wheel pyinstaller packaging
                \$PY -m pip install .
                COLLECT_FLAGS=\$(\$PY -c '$GENERATE_FLAGS_SCRIPT')
                \$PY -m PyInstaller --onefile --noconfirm --strip --noupx --name bangen --distpath dist --workpath build \$COLLECT_FLAGS --optimize 2 _entry.py
                strings dist/bangen | grep GLIBC_ | sort -V | uniq
                # Container ran as root, so dist/ and build/ are root-owned in the mounted
                # workspace. Hand them back to the runner's user or the next step (running
                # as that user) can't mv/rm them.
                chown -R \$HOST_UID:\$HOST_GID /workspace/dist /workspace/build /workspace/.cache
              "
          else
            python -m pip install -U pip wheel pyinstaller packaging
            pip install .
            COLLECT_FLAGS=$(python -c "$GENERATE_FLAGS_SCRIPT")
            python -m PyInstaller --onefile --noconfirm --noupx --name bangen --distpath dist --workpath build $COLLECT_FLAGS --optimize 2 _entry.py
          fi

      # 4. Standardized artifact compression and packaging
      - name: Package Output
        shell: bash
        run: |
          mkdir -p release
          NAME="bangen-${{ matrix.platform }}-${{ needs.tag.outputs.version }}"

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            mv dist/${{ matrix.bin }} release/$NAME.exe
            powershell -Command "Compress-Archive -Path release\\$NAME.exe -DestinationPath release\\$NAME.zip"
            rm release/$NAME.exe
          else
            mv dist/${{ matrix.bin }} release/$NAME
            tar -czf "release/$NAME.tar.gz" -C release "$NAME"
            rm release/$NAME
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release/*
          retention-days: 1

  release:
    needs: [tag, build]
    if: needs.tag.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: "Bangen ${{ needs.tag.outputs.version }}"
          files: artifacts/*
          